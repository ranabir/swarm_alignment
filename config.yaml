scenarios:
  seed: 20260307
  # 6 manipulations x 4 = 24 base cases, 48 scenarios.
  n_per_manipulation: 4
  # Stratified: 6 development pairs for prompt debugging, 18 held-out pairs.
  dev_per_manipulation: 1
  base_date: "2026-03-02"
  output_dir: data/scenarios

experiment:
  # Llama 3.3 70B on Amazon Bedrock, reached through the AWS MCP relay
  # (scripts/04_bedrock_relay.py). For a local run on Apple Silicon instead, use
  # backend: mlx with model: Qwen/Qwen2.5-3B-Instruct.
  backend: bedrock
  model: us.meta.llama3-3-70b-instruct-v1:0
  bedrock_region: us-east-1
  # MLX only: never download weights; use only what is already in the Hugging Face cache.
  offline: true
  mode: controlled
  split: dev
  reps: 1
  seed: 20260307
  # Above zero so that repetitions can differ. At 0.0 they would be identical.
  temperature: 0.7
  upstream_max_tokens: 120
  # Same for C and D. Lower limits cut requirement-matching reviews off before R3.
  review_max_tokens: 700
  decision_max_tokens: 160
  runs_dir: data/runs
  prompt_lock: prompts/prompts.lock.json
